# Upgrade-resistant runtime injection for the local upload monitor.
# This file is mounted into /etc/nginx/conf.d by docker-compose.override.yml,
# so replacing the upstream frontend image does not overwrite it.
sub_filter_once on;
sub_filter '</body>' '<script src="/weknora-upload-monitor.js?v=3"></script></body>';

# The browser-side upload timeout is three minutes. Keep Nginx from rejecting
# a temporarily stalled request body at its 60-second default (HTTP 408), which
# can happen while Windows/OneDrive materializes a selected file.
client_body_timeout 180s;
